name: Deploy Hugo Site to Master

on:
  push:
    branches:
      - source

# Never cancel a running deployment: master is published from it.
concurrency:
  group: "deploy"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: write
  pull-requests: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Build with Hugo
        run: hugo --environment=production -t PaperMod

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: master
          force_orphan: true

      - name: Update PR status comment
        run: |
          pr="$(gh pr list --state merged --base source --limit 10 \
            --json number,mergeCommit \
            --jq ".[] | select(.mergeCommit.oid == \"${{ github.sha }}\") | .number" | head -1)"
          if [ -z "$pr" ]; then
            echo "no merged PR for ${{ github.sha }}, skipping comment"
            exit 0
          fi

          {
            echo "### 🚀 デプロイ完了"
            echo
            echo "| 項目 | 内容 |"
            echo "|---|---|"
            echo "| 公開 URL | https://jedipunkz.rocks/ |"
            echo "| デプロイ | $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST') ([ログ](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})) |"
            echo
            echo "#### コミット履歴"
            echo
            .github/scripts/pr-commit-table.sh "$pr"
          } | .github/scripts/pr-comment.sh "$pr"
